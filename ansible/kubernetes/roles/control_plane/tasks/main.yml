---
- name: Check if Kubernetes control plane is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize Kubernetes control plane
  command: >
    kubeadm init
    --pod-network-cidr=172.16.0.0/16
    --service-cidr=10.96.0.0/12
    --apiserver-advertise-address={{ k8s_private_ip }}
    --apiserver-cert-extra-sans={{ k8s_api_endpoint }}
    --control-plane-endpoint={{ k8s_api_endpoint }}:6443
  when: not kubeadm_admin_conf.stat.exists

- name: Create kubeconfig directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy admin kubeconfig for ubuntu user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Check current apiserver certificate SANs
  shell: |
    openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -text | grep -A1 "Subject Alternative Name" || true
  register: apiserver_cert_sans
  changed_when: false
  when: kubeadm_admin_conf.stat.exists

- name: Create kubeadm config for apiserver certificate renewal
  copy:
    dest: /tmp/kubeadm-renew-apiserver.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.31.14
      controlPlaneEndpoint: {{ k8s_api_endpoint }}:6443
      networking:
        podSubnet: 172.16.0.0/16
        serviceSubnet: 10.96.0.0/12
      apiServer:
        certSANs:
          - {{ k8s_private_ip }}
          - {{ k8s_api_endpoint }}
          - {{ inventory_hostname }}
          - kubernetes
          - kubernetes.default
          - kubernetes.default.svc
          - kubernetes.default.svc.cluster.local
    owner: root
    group: root
    mode: "0600"
  when:
    - kubeadm_admin_conf.stat.exists
    - k8s_api_endpoint not in apiserver_cert_sans.stdout

- name: Backup current apiserver certificate
  shell: |
    mkdir -p /root/k8s-cert-backup
    cp -a /etc/kubernetes/pki/apiserver.crt /root/k8s-cert-backup/apiserver.crt.$(date +%s)
    cp -a /etc/kubernetes/pki/apiserver.key /root/k8s-cert-backup/apiserver.key.$(date +%s)
  when:
    - kubeadm_admin_conf.stat.exists
    - k8s_api_endpoint not in apiserver_cert_sans.stdout

- name: Remove current apiserver certificate
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/pki/apiserver.crt
    - /etc/kubernetes/pki/apiserver.key
  when:
    - kubeadm_admin_conf.stat.exists
    - k8s_api_endpoint not in apiserver_cert_sans.stdout

- name: Renew apiserver certificate with configured API endpoint SAN
  command: kubeadm init phase certs apiserver --config /tmp/kubeadm-renew-apiserver.yaml
  register: apiserver_cert_renew
  when:
    - kubeadm_admin_conf.stat.exists
    - k8s_api_endpoint not in apiserver_cert_sans.stdout

- name: Restart kube-apiserver static pod after certificate renewal
  shell: |
    mv /etc/kubernetes/manifests/kube-apiserver.yaml /tmp/kube-apiserver.yaml
    sleep 10
    mv /tmp/kube-apiserver.yaml /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 20
  when:
    - apiserver_cert_renew is defined
    - apiserver_cert_renew.changed

- name: Read kubeadm ConfigMap
  command: kubectl -n kube-system get cm kubeadm-config -o yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubeadm_configmap
  changed_when: false

- name: Write kubeadm ConfigMap with configured API endpoint
  copy:
    dest: /tmp/kubeadm-config.yaml
    content: "{{ kubeadm_configmap.stdout | replace(k8s_private_ip ~ ':6443', k8s_api_endpoint ~ ':6443') | replace('advertiseAddress: ' ~ k8s_private_ip, 'advertiseAddress: ' ~ k8s_api_endpoint) }}\n"
    owner: root
    group: root
    mode: "0600"
  when: k8s_private_ip in kubeadm_configmap.stdout

- name: Apply kubeadm ConfigMap with configured API endpoint
  command: kubectl replace -f /tmp/kubeadm-config.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: k8s_private_ip in kubeadm_configmap.stdout

- name: Read cluster-info ConfigMap
  command: kubectl -n kube-public get cm cluster-info -o yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cluster_info_configmap
  changed_when: false

- name: Write cluster-info ConfigMap with configured API endpoint
  copy:
    dest: /tmp/cluster-info.yaml
    content: "{{ cluster_info_configmap.stdout | replace(k8s_private_ip ~ ':6443', k8s_api_endpoint ~ ':6443') | replace('https://' ~ k8s_private_ip, 'https://' ~ k8s_api_endpoint) }}\n"
    owner: root
    group: root
    mode: "0600"
  when: k8s_private_ip in cluster_info_configmap.stdout

- name: Apply cluster-info ConfigMap with configured API endpoint
  command: kubectl replace -f /tmp/cluster-info.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: k8s_private_ip in cluster_info_configmap.stdout

- name: Verify Kubernetes discovery endpoints
  shell: |
    echo "=== kubeadm-config ==="
    kubectl -n kube-system get cm kubeadm-config -o yaml | grep -E "{{ k8s_private_ip }}|{{ k8s_api_endpoint }}" || true

    echo "=== cluster-info ==="
    kubectl -n kube-public get cm cluster-info -o yaml | grep -E "{{ k8s_private_ip }}|{{ k8s_api_endpoint }}" || true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubernetes_endpoint_verify
  changed_when: false

- name: Show Kubernetes discovery endpoint verification
  debug:
    var: kubernetes_endpoint_verify.stdout_lines

- name: Fail if Kubernetes discovery still contains wrong API endpoint
  fail:
    msg: "Kubernetes discovery data still contains unexpected API endpoint. Check k8s_private_ip={{ k8s_private_ip }} and k8s_api_endpoint={{ k8s_api_endpoint }}."
  when:
    - k8s_private_ip != k8s_api_endpoint
    - k8s_private_ip in kubernetes_endpoint_verify.stdout

- name: Check if Cilium CLI is installed
  stat:
    path: /usr/local/bin/cilium
  register: cilium_cli

- name: Check if Cilium CLI archive already exists
  stat:
    path: /tmp/cilium-linux-amd64.tar.gz
  register: cilium_cli_archive
  when: not cilium_cli.stat.exists

- name: Download Cilium CLI archive
  get_url:
    url: https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz
    dest: /tmp/cilium-linux-amd64.tar.gz
    mode: "0644"
  when:
    - not cilium_cli.stat.exists
    - not cilium_cli_archive.stat.exists

- name: Extract Cilium CLI
  unarchive:
    src: /tmp/cilium-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: not cilium_cli.stat.exists

- name: Check if Cilium is already installed
  command: cilium status --wait=false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_status
  changed_when: false
  failed_when: false

- name: Install Cilium CNI with configured pod CIDR
  command: >
    cilium install
    --set ipam.mode=cluster-pool
    --set ipam.operator.clusterPoolIPv4PodCIDRList=172.16.0.0/16
    --set ipam.operator.clusterPoolIPv4MaskSize=24
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: cilium_status.rc != 0

- name: Ensure Cilium CNI is configured with cluster pod CIDR
  command: >
    cilium upgrade
    --set ipam.mode=cluster-pool
    --set ipam.operator.clusterPoolIPv4PodCIDRList=172.16.0.0/16
    --set ipam.operator.clusterPoolIPv4MaskSize=24
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_upgrade
  changed_when:
    - "'No changes' not in cilium_upgrade.stdout"
    - "'No changes' not in cilium_upgrade.stderr"
  when: cilium_status.rc == 0

- name: Restart Cilium DaemonSet after configuration update
  command: kubectl -n kube-system rollout restart ds/cilium
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when:
    - cilium_upgrade is defined
    - cilium_upgrade.changed

- name: Wait for Cilium rollout after configuration update
  command: kubectl -n kube-system rollout status ds/cilium --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  failed_when: false
  when:
    - cilium_upgrade is defined
    - cilium_upgrade.changed

- name: Wait for Cilium to become ready
  command: cilium status --wait --wait-duration 120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: cilium_wait
  failed_when: false

- name: Show Cilium status if not ready yet
  command: cilium status --wait=false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  when: cilium_wait.rc != 0

- name: Generate kubeadm join command
  command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Save kubeadm join command with configured API endpoint
  copy:
    dest: /tmp/kubeadm_join_command.sh
    content: "{{ kubeadm_join_command.stdout | regex_replace('kubeadm join [^ ]+', 'kubeadm join ' ~ k8s_api_endpoint ~ ':6443') }}\n"
    owner: root
    group: root
    mode: "0600"