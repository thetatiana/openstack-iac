---
- name: Check if Kubernetes control plane is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize Kubernetes control plane
  command: >
    kubeadm init
    --pod-network-cidr=172.16.0.0/16
    --service-cidr=10.96.0.0/12
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --apiserver-cert-extra-sans={{ ansible_host }}
    --control-plane-endpoint={{ ansible_host }}:6443
  when: not kubeadm_admin_conf.stat.exists

- name: Create kubeconfig directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy admin kubeconfig for ubuntu user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Check current apiserver certificate SANs
  shell: |
    openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -text | grep -A1 "Subject Alternative Name" || true
  register: apiserver_cert_sans
  changed_when: false
  when: kubeadm_admin_conf.stat.exists

- name: Create kubeadm config for apiserver certificate renewal
  copy:
    dest: /tmp/kubeadm-renew-apiserver.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: v1.31.14
      controlPlaneEndpoint: {{ ansible_host }}:6443
      networking:
        podSubnet: 172.16.0.0/16
        serviceSubnet: 10.96.0.0/12
      apiServer:
        certSANs:
          - {{ ansible_default_ipv4.address }}
          - {{ ansible_host }}
          - {{ inventory_hostname }}
          - kubernetes
          - kubernetes.default
          - kubernetes.default.svc
          - kubernetes.default.svc.cluster.local
    owner: root
    group: root
    mode: "0600"
  when:
    - kubeadm_admin_conf.stat.exists
    - ansible_host not in apiserver_cert_sans.stdout

- name: Backup current apiserver certificate
  shell: |
    mkdir -p /root/k8s-cert-backup
    cp -a /etc/kubernetes/pki/apiserver.crt /root/k8s-cert-backup/apiserver.crt.$(date +%s)
    cp -a /etc/kubernetes/pki/apiserver.key /root/k8s-cert-backup/apiserver.key.$(date +%s)
  when:
    - kubeadm_admin_conf.stat.exists
    - ansible_host not in apiserver_cert_sans.stdout

- name: Remove current apiserver certificate
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/pki/apiserver.crt
    - /etc/kubernetes/pki/apiserver.key
  when:
    - kubeadm_admin_conf.stat.exists
    - ansible_host not in apiserver_cert_sans.stdout

- name: Renew apiserver certificate with floating IP SAN
  command: kubeadm init phase certs apiserver --config /tmp/kubeadm-renew-apiserver.yaml
  when:
    - kubeadm_admin_conf.stat.exists
    - ansible_host not in apiserver_cert_sans.stdout
  notify: Restart kube-apiserver static pod

- name: Flush handlers after apiserver certificate renewal
  meta: flush_handlers

- name: Read kubeadm ConfigMap
  command: kubectl -n kube-system get cm kubeadm-config -o yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubeadm_configmap
  changed_when: false

- name: Write kubeadm ConfigMap with floating controlPlaneEndpoint
  copy:
    dest: /tmp/kubeadm-config.yaml
    content: "{{ kubeadm_configmap.stdout | replace(ansible_default_ipv4.address ~ ':6443', ansible_host ~ ':6443') }}"
    owner: root
    group: root
    mode: "0600"
  when: ansible_default_ipv4.address ~ ':6443' in kubeadm_configmap.stdout

- name: Apply kubeadm ConfigMap with floating controlPlaneEndpoint
  command: kubectl apply -f /tmp/kubeadm-config.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: ansible_default_ipv4.address ~ ':6443' in kubeadm_configmap.stdout

- name: Check if Cilium CLI is installed
  stat:
    path: /usr/local/bin/cilium
  register: cilium_cli

- name: Check if Cilium CLI archive already exists
  stat:
    path: /tmp/cilium-linux-amd64.tar.gz
  register: cilium_cli_archive
  when: not cilium_cli.stat.exists

- name: Download Cilium CLI archive
  get_url:
    url: https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz
    dest: /tmp/cilium-linux-amd64.tar.gz
    mode: "0644"
  when:
    - not cilium_cli.stat.exists
    - not cilium_cli_archive.stat.exists

- name: Extract Cilium CLI
  unarchive:
    src: /tmp/cilium-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: not cilium_cli.stat.exists

- name: Check if Cilium is already installed
  command: cilium status
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_status
  changed_when: false
  failed_when: false

- name: Install Cilium CNI
  command: cilium install
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: cilium_status.rc != 0

- name: Wait for Cilium to become ready
  command: cilium status --wait
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Generate kubeadm join command
  command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Save kubeadm join command with floating endpoint
  copy:
    dest: /tmp/kubeadm_join_command.sh
    content: "{{ kubeadm_join_command.stdout | regex_replace('kubeadm join [^ ]+', 'kubeadm join ' ~ ansible_host ~ ':6443') }}\n"
    owner: root
    group: root
    mode: "0600"